version: '3.8'

services:
  engine:
    build: .
    container_name: nepean_engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Maps local server directory to the container data directory
      - ./server_data:/app/data
    environment:
      - NODE_ENV=production
      # Uncomment and set this if deploying behind a Cloudflare Tunnel
      # - APP_ORIGIN=https://invoices.yourdomain.com
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3