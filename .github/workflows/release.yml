name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ] # Runs every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: obviously-shadow/invoice-engine

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: obviously-shadow/invoice-engine:latest
          # This injects the unique GitHub commit fingerprint into your app
          build-args: |
            IMAGE_SHA=${{ github.sha }}